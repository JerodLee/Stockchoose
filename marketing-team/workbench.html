<title>마케팅팀 워크벤치</title>
<style>
  :root {
    --bg:#eef3f2; --surface:#fff; --surface-2:#f6faf9; --ink:#10201e; --muted:#566b68;
    --faint:#849794; --border:#dde7e5; --accent:#0c948c; --accent-ink:#fff; --accent-soft:#d6efec;
    --good:#1f9d57; --good-soft:#d9f2e3; --warn:#b8760f; --warn-soft:#f6e9cf;
    --idle:#6c7d7a; --idle-soft:#e6ecea;
    --shadow:0 1px 2px rgba(16,32,30,.06),0 8px 24px rgba(16,32,30,.05);
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI","Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  @media (prefers-color-scheme:dark){:root{
    --bg:#08110f; --surface:#0e1a18; --surface-2:#0b1614; --ink:#e7f0ee; --muted:#8ea3a0;
    --faint:#5c706d; --border:#1d2f2c; --accent:#2fd4c6; --accent-ink:#04211e; --accent-soft:#10312e;
    --good:#3bd97e; --good-soft:#0f2e1e; --warn:#e6a53c; --warn-soft:#322510;
    --idle:#7d8f8c; --idle-soft:#16211f; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }}
  :root[data-theme="light"]{--bg:#eef3f2;--surface:#fff;--surface-2:#f6faf9;--ink:#10201e;--muted:#566b68;--faint:#849794;--border:#dde7e5;--accent:#0c948c;--accent-ink:#fff;--accent-soft:#d6efec;--good:#1f9d57;--good-soft:#d9f2e3;--warn:#b8760f;--warn-soft:#f6e9cf;--idle:#6c7d7a;--idle-soft:#e6ecea;--shadow:0 1px 2px rgba(16,32,30,.06),0 8px 24px rgba(16,32,30,.05);}
  :root[data-theme="dark"]{--bg:#08110f;--surface:#0e1a18;--surface-2:#0b1614;--ink:#e7f0ee;--muted:#8ea3a0;--faint:#5c706d;--border:#1d2f2c;--accent:#2fd4c6;--accent-ink:#04211e;--accent-soft:#10312e;--good:#3bd97e;--good-soft:#0f2e1e;--warn:#e6a53c;--warn-soft:#322510;--idle:#7d8f8c;--idle-soft:#16211f;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);}

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  button,input,textarea,select{font-family:inherit}
  button{cursor:pointer}
  .btn{border:1px solid var(--border);background:var(--surface);color:var(--ink);border-radius:9px;padding:7px 13px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:.15s}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .btn.primary:hover{filter:brightness(1.05)}
  .btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
  .btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
  input,textarea,select{background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:9px 11px;color:var(--ink);font-size:13px;width:100%}
  textarea{resize:vertical;min-height:90px;line-height:1.5}
  input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
  label.fld{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 5px}

  header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
  .head{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:10px;margin-right:auto}
  .logo .m{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:17px}
  .logo h1{font-size:15px;margin:0;font-weight:700}
  .logo .s{font-size:11px;color:var(--muted)}
  select.camp{max-width:230px;width:auto;font-weight:600}

  .wrap{max-width:1180px;margin:0 auto;padding:20px 20px 80px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:8px}
  .tile{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:13px 15px;box-shadow:var(--shadow)}
  .tile .k{font-size:11px;color:var(--muted);font-weight:600}
  .tile .v{font-family:var(--mono);font-size:23px;font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums}
  .tile .v small{font-size:13px;color:var(--muted)}

  h2.sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin:30px 0 12px;display:flex;align-items:center;gap:10px}
  h2.sec .act{margin-left:auto;display:flex;gap:7px}

  .brief{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .brief .full{grid-column:1/-1}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .emp{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
  .emp-top{display:flex;align-items:center;gap:10px}
  .ava{width:38px;height:38px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);display:grid;place-items:center;font-size:19px;flex:none}
  .emp .role{font-weight:700;font-size:14px}
  .emp .code{font-family:var(--mono);font-size:10.5px;color:var(--accent);background:var(--accent-soft);padding:1px 6px;border-radius:5px;display:inline-block;margin-top:3px}
  .emp .duty{font-size:12px;color:var(--muted);flex:1}
  .emp .cnt{font-family:var(--mono);font-size:11px;color:var(--faint)}

  .cols{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .col{background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:12px;min-height:120px}
  .col h3{margin:0 0 10px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:7px}
  .col h3 .badge{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto;font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .task{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:11px;margin-bottom:9px}
  .task .tt{font-weight:600;font-size:13px;margin-bottom:4px}
  .task .meta{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .task .row{display:flex;gap:6px;flex-wrap:wrap}
  .empty{color:var(--faint);font-size:12px;text-align:center;padding:18px 0}

  .modal-bg{position:fixed;inset:0;background:rgba(8,17,15,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal-bg.open{display:flex}
  .modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.4);width:100%;max-width:640px;max-height:88vh;overflow:auto}
  .modal-h{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--surface)}
  .modal-h .tt{font-weight:700;font-size:15px}
  .modal-b{padding:18px;display:flex;flex-direction:column;gap:14px}
  .modal-f{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:var(--surface)}
  .hint{font-size:12px;color:var(--muted);background:var(--accent-soft);border-radius:9px;padding:9px 12px}
  pre.prompt{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:12px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto;margin:0}
  .out-view{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:13px;white-space:pre-wrap;word-break:break-word;line-height:1.6}
  .pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px}
  .pill.queued{color:var(--warn);background:var(--warn-soft)}
  .pill.doing{color:var(--accent);background:var(--accent-soft)}
  .pill.done{color:var(--good);background:var(--good-soft)}
  .foot{margin-top:34px;font-size:11.5px;color:var(--faint);text-align:center;line-height:1.7}
  @media (max-width:680px){.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.brief{grid-template-columns:1fr}}
</style>

<header>
  <div class="head">
    <div class="logo"><div class="m">🛠️</div><div><h1>마케팅팀 워크벤치</h1><div class="s">GUI에서 모든 작업 실행 · 생성만 클로드코드로</div></div></div>
    <select class="camp" id="campSel" aria-label="캠페인 선택"></select>
    <button class="btn" id="newCamp">+ 새 캠페인</button>
    <button class="btn ghost" id="menuBtn" title="가져오기/내보내기">⋯</button>
  </div>
</header>

<div class="wrap">
  <div class="stats" id="stats"></div>

  <h2 class="sec">캠페인 브리핑 <span class="act"><button class="btn sm" id="saveBrief">저장</button></span></h2>
  <div class="brief">
    <div><label class="fld">캠페인명</label><input id="bName" placeholder="예: 여름 쿨링 런칭"></div>
    <div><label class="fld">상품</label><input id="bProduct" placeholder="예: 무선 미니선풍기"></div>
    <div class="full"><label class="fld">브리핑 (타깃·핵심가치·특이사항)</label><textarea id="bBrief" placeholder="누구에게, 무엇을, 왜 파는지. 아는 스펙/제약도 적어두면 결과 품질이 올라갑니다."></textarea></div>
  </div>

  <h2 class="sec">직원 <span class="act"><button class="btn sm" id="addEmp">+ 직원 추가</button></span></h2>
  <div class="grid" id="emps"></div>

  <h2 class="sec">작업 보드</h2>
  <div class="cols">
    <div class="col"><h3><span class="dot" style="background:var(--warn)"></span>요청됨(큐) <span class="badge" id="c-queued">0</span></h3><div id="col-queued"></div></div>
    <div class="col"><h3><span class="dot" style="background:var(--accent)"></span>진행중 <span class="badge" id="c-doing">0</span></h3><div id="col-doing"></div></div>
    <div class="col"><h3><span class="dot" style="background:var(--good)"></span>완료 <span class="badge" id="c-done">0</span></h3><div id="col-done"></div></div>
  </div>

  <div class="foot" id="foot"></div>
</div>

<!-- Modal -->
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
"use strict";
const KEY = "mt-workbench-v1";
const $ = s => document.querySelector(s);

const DEFAULT_EMPLOYEES = [
  { code:"product-discovery", role:"상품 발굴관", icon:"🔎", duty:"오픈마켓 실스펙 조사(소음·시간·무게·mAh)" },
  { code:"product-marketing", role:"전략기획관", icon:"📋", duty:"제품·타깃 포지셔닝 문서" },
  { code:"product-selection", role:"우수상품 선정관", icon:"🏆", duty:"후보 평가 → 우수상품 선정+사유" },
  { code:"copywriting", role:"카피라이터", icon:"✍️", duty:"상세페이지 판매 문구" },
  { code:"ad-creative", role:"광고기획관", icon:"📣", duty:"광고 앵글·후크" },
  { code:"image", role:"이미지 디자이너", icon:"🎨", duty:"상세컷·웹툰·썸네일" },
  { code:"video", role:"영상 제작자", icon:"🎥", duty:"릴스·쇼츠 영상 구성" },
  { code:"review-management", role:"리뷰 관리관", icon:"⭐", duty:"별점 관리·리뷰 응대" },
  { code:"customer-support", role:"CS 응대관", icon:"💬", duty:"FAQ·반품 응대" },
];

function seed() {
  const id = "c_seed";
  return {
    activeId: id,
    employees: DEFAULT_EMPLOYEES.slice(),
    campaigns: {
      [id]: {
        id, name:"휴대용 선풍기 캠페인", product:"무선 미니선풍기",
        brief:"타깃: 출퇴근·야외활동 20~30대. 핵심가치: BLDC 저소음·5000mAh 겸용. 주의: 소음(dB)·사용시간·무게는 실측으로 채울 것.",
        tasks:[
          { id:"t1", code:"product-selection", role:"우수상품 선정관", title:"휴대용 선풍기 6종 우수상품 선정", status:"done",
            output:"우수 3종: ①BLDC 3-in-1 겸용(88) ②날개없는 넥밴드(83) ③BLDC 넥밴드(83). 저가 DC 핸디형은 수요 최고나 경쟁·마진 최악으로 제외." , created:1 },
          { id:"t2", code:"copywriting", role:"카피라이터", title:"BLDC 겸용 상세페이지 카피", status:"done",
            output:"헤드라인: '선풍기 3개 살 돈으로, 이거 하나.' / 이득: BLDC 저소음(~35dB)·5000mAh 파워뱅크 겸용·3-in-1.", created:2 },
          { id:"t3", code:"ad-creative", role:"광고기획관", title:"BLDC 겸용 광고 앵글", status:"queued", output:"", created:3 },
        ],
      },
    },
  };
}

let state = load();
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.campaigns) return s; }catch(e){} return seed(); }
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
function uid(p){ return p + Math.random().toString(36).slice(2,8) + (state._n=(state._n||0)+1); }
function active(){ return state.campaigns[state.activeId]; }
const esc = t => String(t==null?"":t).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

/* ---------- Claude Code bridge ---------- */
function buildPrompt(task, camp) {
  return `당신은 이 마케팅팀의 "${task.role}" (스킬: ${task.code}) 입니다.
아래 캠페인 브리핑을 바탕으로 작업을 수행하고, 결과 텍스트만 반환하세요.
규칙: marketing-team/skills/${task.code}/SKILL.md 를 따르고, 모르는 스펙/수치는 지어내지 말고 [__]로 남기세요.

[캠페인] ${camp.name}
[상품] ${camp.product}
[브리핑]
${camp.brief || "(브리핑 없음)"}

[작업]
${task.title}`;
}

/* ---------- render ---------- */
function render() {
  // campaign selector
  const sel = $("#campSel");
  sel.innerHTML = Object.values(state.campaigns).map(c=>`<option value="${c.id}"${c.id===state.activeId?" selected":""}>${esc(c.name)}</option>`).join("");
  const c = active();
  if(!c){ return; }

  $("#bName").value = c.name; $("#bProduct").value = c.product; $("#bBrief").value = c.brief||"";

  const t = c.tasks;
  const cnt = s => t.filter(x=>x.status===s).length;
  $("#stats").innerHTML = [
    ["직원", state.employees.length, "명"],
    ["작업 총계", t.length, "건"],
    ["진행중+대기", cnt("queued")+cnt("doing"), "건"],
    ["완료", cnt("done"), `/ ${t.length}`],
  ].map(([k,v,u])=>`<div class="tile"><div class="k">${k}</div><div class="v">${v}<small> ${u}</small></div></div>`).join("");

  // employees
  $("#emps").innerHTML = state.employees.map(e=>{
    const n = t.filter(x=>x.code===e.code).length;
    return `<div class="emp">
      <div class="emp-top"><div class="ava">${e.icon||"🧩"}</div>
        <div style="flex:1"><div class="role">${esc(e.role)}</div><span class="code">${esc(e.code)}</span></div></div>
      <div class="duty">${esc(e.duty)}</div>
      <div style="display:flex;align-items:center;gap:8px"><span class="cnt">작업 ${n}건</span>
        <button class="btn sm primary" data-act="request" data-code="${e.code}" style="margin-left:auto">＋ 작업 요청</button></div>
    </div>`;
  }).join("");

  // task columns
  for(const st of ["queued","doing","done"]){
    const items = t.filter(x=>x.status===st).sort((a,b)=>b.created-a.created);
    $("#c-"+st).textContent = items.length;
    $("#col-"+st).innerHTML = items.length ? items.map(x=>taskCard(x)).join("") : `<div class="empty">없음</div>`;
  }

  $("#foot").innerHTML = `데이터는 이 브라우저(localStorage)에 저장됩니다 · 캠페인 ${Object.keys(state.campaigns).length}개 · 범용: 어떤 상품에도 재사용`;
  save();
}

function taskCard(x){
  const emp = state.employees.find(e=>e.code===x.code);
  const acts = {
    queued:`<button class="btn sm primary" data-act="bridge" data-id="${x.id}">🤖 클로드코드로</button>
            <button class="btn sm ghost" data-act="del" data-id="${x.id}">삭제</button>`,
    doing:`<button class="btn sm primary" data-act="bridge" data-id="${x.id}">📥 결과 입력</button>
           <button class="btn sm ghost" data-act="back" data-id="${x.id}">↩︎ 큐로</button>`,
    done:`<button class="btn sm" data-act="view" data-id="${x.id}">📄 결과 보기</button>
          <button class="btn sm ghost" data-act="del" data-id="${x.id}">삭제</button>`,
  }[x.status];
  return `<div class="task">
    <div class="tt">${esc(x.title)}</div>
    <div class="meta"><span>${emp?emp.icon:"🧩"} ${esc(x.role)}</span><span class="pill ${x.status}">${({queued:"요청됨",doing:"진행중",done:"완료"})[x.status]}</span></div>
    <div class="row">${acts}</div>
  </div>`;
}

/* ---------- modal ---------- */
function openModal(html){ $("#modal").innerHTML = html; $("#modalBg").classList.add("open"); }
function closeModal(){ $("#modalBg").classList.remove("open"); }
$("#modalBg").addEventListener("click", e=>{ if(e.target===$("#modalBg")) closeModal(); });

function requestModal(code){
  const emp = state.employees.find(e=>e.code===code);
  openModal(`<div class="modal-h"><div class="ava">${emp.icon}</div><div class="tt">${esc(emp.role)}에게 작업 요청</div><button class="btn ghost" data-act="close" style="margin-left:auto">✕</button></div>
    <div class="modal-b">
      <div class="hint">${esc(emp.duty)}</div>
      <div><label class="fld">작업 내용</label><textarea id="taskTitle" placeholder="예: BLDC 겸용 상세페이지 카피 작성"></textarea></div>
    </div>
    <div class="modal-f"><button class="btn" data-act="close">취소</button><button class="btn primary" data-act="createTask" data-code="${code}">작업 생성 (큐에 추가)</button></div>`);
  setTimeout(()=>$("#taskTitle") && $("#taskTitle").focus(),50);
}

function bridgeModal(id){
  const c = active(); const task = c.tasks.find(t=>t.id===id);
  const prompt = buildPrompt(task, c);
  const isDoing = task.status==="doing";
  openModal(`<div class="modal-h"><div class="tt">🤖 클로드코드 브리지</div><button class="btn ghost" data-act="close" style="margin-left:auto">✕</button></div>
    <div class="modal-b">
      <div class="hint">① 아래 프롬프트를 <b>클로드코드에 붙여넣어</b> 실행 → ② 나온 결과를 <b>아래 칸에 붙여넣고 저장</b>하면 완료 처리됩니다. (AI 생성만 클로드코드가 담당)</div>
      <div><label class="fld">① 클로드코드에 붙여넣을 프롬프트</label><pre class="prompt" id="promptText">${esc(prompt)}</pre>
        <div style="margin-top:8px"><button class="btn sm" data-act="copyPrompt">📋 프롬프트 복사</button>
        ${task.status==="queued"?`<button class="btn sm" data-act="markDoing" data-id="${id}">진행중으로 표시</button>`:""}</div></div>
      <div><label class="fld">② 클로드코드 결과 붙여넣기</label><textarea id="resultBox" placeholder="여기에 결과를 붙여넣으세요">${esc(task.output||"")}</textarea></div>
    </div>
    <div class="modal-f"><button class="btn" data-act="close">닫기</button><button class="btn primary" data-act="saveResult" data-id="${id}">결과 저장 · 완료</button></div>`);
}

function viewModal(id){
  const task = active().tasks.find(t=>t.id===id);
  openModal(`<div class="modal-h"><div class="tt">📄 ${esc(task.title)}</div><button class="btn ghost" data-act="close" style="margin-left:auto">✕</button></div>
    <div class="modal-b"><div class="meta" style="font-size:12px;color:var(--muted)">${esc(task.role)} · 완료</div>
      <div class="out-view">${esc(task.output)||"(내용 없음)"}</div></div>
    <div class="modal-f"><button class="btn" data-act="bridge" data-id="${id}">✏️ 다시 편집</button><button class="btn primary" data-act="close">닫기</button></div>`);
}

function empModal(){
  openModal(`<div class="modal-h"><div class="tt">＋ 직원 추가</div><button class="btn ghost" data-act="close" style="margin-left:auto">✕</button></div>
    <div class="modal-b">
      <div class="hint">스킬 코드는 marketing-team/skills/ 아래 폴더명과 맞추면 프롬프트가 해당 매뉴얼을 참조합니다.</div>
      <div style="display:grid;grid-template-columns:70px 1fr;gap:10px">
        <div><label class="fld">이모지</label><input id="eIcon" value="🧩"></div>
        <div><label class="fld">직무명</label><input id="eRole" placeholder="예: 가격 전략관"></div>
      </div>
      <div><label class="fld">스킬 코드</label><input id="eCode" placeholder="예: pricing"></div>
      <div><label class="fld">담당 업무</label><input id="eDuty" placeholder="예: 가격 티어·마진 전략"></div>
    </div>
    <div class="modal-f"><button class="btn" data-act="close">취소</button><button class="btn primary" data-act="createEmp">추가</button></div>`);
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act, id = b.dataset.id, code = b.dataset.code;
  const c = active();
  if(act==="close") return closeModal();
  if(act==="request") return requestModal(code);
  if(act==="createTask"){
    const title = ($("#taskTitle").value||"").trim(); if(!title) return $("#taskTitle").focus();
    const emp = state.employees.find(x=>x.code===b.dataset.code);
    c.tasks.push({ id:uid("t"), code:emp.code, role:emp.role, title, status:"queued", output:"", created:Date.now() });
    closeModal(); render(); return;
  }
  if(act==="bridge") return bridgeModal(id);
  if(act==="view") return viewModal(id);
  if(act==="markDoing"){ const t=c.tasks.find(x=>x.id===id); t.status="doing"; render(); return bridgeModal(id); }
  if(act==="back"){ const t=c.tasks.find(x=>x.id===id); t.status="queued"; closeModal(); return render(); }
  if(act==="copyPrompt"){ navigator.clipboard && navigator.clipboard.writeText($("#promptText").textContent); b.textContent="✓ 복사됨"; setTimeout(()=>b.textContent="📋 프롬프트 복사",1400); return; }
  if(act==="saveResult"){ const t=c.tasks.find(x=>x.id===id); t.output=$("#resultBox").value; t.status="done"; closeModal(); return render(); }
  if(act==="del"){ if(!confirm("이 작업을 삭제할까요?")) return; c.tasks=c.tasks.filter(x=>x.id!==id); closeModal(); return render(); }
  if(act==="addEmp") return empModal();
  if(act==="createEmp"){
    const role=($("#eRole").value||"").trim(), cd=($("#eCode").value||"").trim();
    if(!role||!cd) return alert("직무명과 스킬 코드는 필수입니다");
    if(state.employees.some(x=>x.code===cd)) return alert("이미 있는 스킬 코드입니다");
    state.employees.push({ code:cd, role, icon:($("#eIcon").value||"🧩").trim(), duty:($("#eDuty").value||"").trim() });
    closeModal(); return render();
  }
});

$("#campSel").addEventListener("change", e=>{ state.activeId=e.target.value; render(); });
$("#newCamp").addEventListener("click", ()=>{
  const name = prompt("새 캠페인 이름:", "새 캠페인"); if(name===null) return;
  const id = uid("c");
  state.campaigns[id] = { id, name:name||"새 캠페인", product:"", brief:"", tasks:[] };
  state.activeId = id; render();
});
$("#saveBrief").addEventListener("click", ()=>{
  const c=active(); c.name=$("#bName").value.trim()||"이름없음"; c.product=$("#bProduct").value.trim(); c.brief=$("#bBrief").value;
  const btn=$("#saveBrief"); btn.textContent="✓ 저장됨"; setTimeout(()=>btn.textContent="저장",1200); render();
});
$("#menuBtn").addEventListener("click", ()=>{
  openModal(`<div class="modal-h"><div class="tt">⋯ 데이터</div><button class="btn ghost" data-act="close" style="margin-left:auto">✕</button></div>
    <div class="modal-b">
      <div class="hint">모든 데이터는 이 브라우저에만 저장됩니다. 백업/이전은 JSON으로.</div>
      <div><label class="fld">현재 데이터 (JSON)</label><textarea id="ioBox" style="min-height:160px;font-family:var(--mono);font-size:11px">${esc(JSON.stringify(state,null,2))}</textarea></div>
    </div>
    <div class="modal-f">
      <button class="btn" onclick="(function(){const t=document.getElementById('ioBox');t.select();navigator.clipboard&&navigator.clipboard.writeText(t.value);})()">📋 복사</button>
      <button class="btn" id="importBtn">가져오기(붙여넣은 JSON 적용)</button>
      <button class="btn primary" data-act="close">닫기</button>
    </div>`);
  $("#importBtn").addEventListener("click", ()=>{
    try{ const s=JSON.parse($("#ioBox").value); if(!s.campaigns) throw 0; state=s; if(!state.activeId) state.activeId=Object.keys(state.campaigns)[0]; closeModal(); render(); }
    catch(e){ alert("올바른 JSON이 아닙니다"); }
  });
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeModal(); });

render();
</script>
