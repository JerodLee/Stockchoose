services:
  - type: web
    name: stockchoose-terminal
    runtime: node
    branch: claude/tech-indices-dashboard-QTA5n
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NODE_ENV
        value: production
    autoDeploy: true
